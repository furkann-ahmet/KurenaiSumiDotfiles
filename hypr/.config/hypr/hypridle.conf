# Hypridle — boşta kalma yönetimi (masaüstü: uyutma yok, sadece kilit + ekran kapatma)

general {
    # lock.sh sırayla gtklock → swaylock → hyprlock dener; guard ÜÇÜNÜ de kontrol
    # etmeli ki kilitliyken lock-session tekrar gelirse ikinci instance açılmasın
    lock_cmd = pidof gtklock || pidof swaylock || pidof hyprlock || /home/furkan/.config/hypr/lock.sh
    before_sleep_cmd = loginctl lock-session     # uyumadan önce kilitle
    after_sleep_cmd = hyprctl dispatch dpms on   # uyanınca ekranları aç
}

# 5 dk sonra kilitle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 dk sonra ekranları kapat (DPMS)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
