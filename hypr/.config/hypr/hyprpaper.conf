splash = false
ipc = on

# hyprpaper v0.8.x BLOK söz dizimi kullanır (preload=/wallpaper= DEĞİL!)
# monitor =  (boş) -> tüm monitörlere uygulanır
# scaled/ = monitörün native çözünürlüğüne indirilmiş kopyalar (6688px orijinaller
# ~40MB'tı; decode yavaş + RAM şişkindi). Orijinaller duruyor — matugen/retheme
# renk çıkarımı için orijinal samurai.png'yi kullanmaya devam edebilir.
wallpaper {
    monitor = DP-3
    path = /home/furkan/Pictures/Wallpapers/scaled/samurai-dp3.png
}

wallpaper {
    monitor = DP-2
    path = /home/furkan/Pictures/Wallpapers/scaled/katana-dp2.png
}

wallpaper {
    monitor = DP-1
    path = /home/furkan/Pictures/Wallpapers/scaled/wall-dp1.png
}

# Tek tek atamak istersen her monitör için ayrı blok:
# wallpaper {
#     monitor = DP-3
